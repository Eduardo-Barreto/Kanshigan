[project]
name = "kanshigan-pos-banca"
version = "0.1.0"
description = "Pos-banca: auditoria estrutural sem rotulos da saida da pipeline em footage nao anotado (categoria RC)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../pre-banca"]
